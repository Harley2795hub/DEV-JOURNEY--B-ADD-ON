<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hometown</title>
    <style>
      body {
        background-image: url(https://img.static-kl.com/images/media/028AE86F-56BE-4562-A68B64D8F2EB2AA7);
        background-repeat: no-repeat;
        background-position: initial;
        display: block;
        background-color: black;
        background-size: cover;
      }
      .container {
        background-color: rgba(255, 255, 255, 0.395);
        display: block;
        border-radius: 10px;
        max-width: 600px;
        max-height: fit-content;
        margin: 0 auto;
        padding: 15px 60px;
      }
      h1 {
        display: block;
        color: rgb(0, 0, 0);
        text-align: center;
        font-size: 40px;
        text-shadow: 5px 5px 15px rgb(254, 255, 238);
        font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande",
          "Lucida Sans", Arial, sans-serif;
      }
      h2 {
        display: block;
        color: rgb(0, 0, 0);
        text-align: center;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Stockholm</h1>
      <h2>Capital and most populous city of Sweden</h2>
    </div>
  </body>
</html>
