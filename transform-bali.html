<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Transition Bali</title>
    <style>
      body {
        margin: 200px;
      }
      img {
        width: 200px;
      }
      .one {
        transform: scale(2) rotate(-40deg);
      }
      .two {
        transform: rotateY(150deg) translate(100px, 0px) scale(1.5);
      }
      .three {
        transform: rotateZ(-70deg) scale(3, 1);
      }
      .four {
        transform: rotateZ(360deg) skew(85deg, -200deg);
      }
    </style>
  </head>
  <body>
    <img
      class="one"
      src="https://www.checkpointtravel.se/media/10268/shutterstock_380725909-pura-ulun-danu-bratan-hindu-temple-on-bratan-lake-landscape-one-of-famous-tourist-attraction-in-bali-indonesia.jpg?rxy=0.5,0.5&width=1920&height=1440&format=webp&autoorient=true"
      alt=""
    />

    <img
      class="two"
      src="https://media.digitalnomads.world/wp-content/uploads/2021/01/20120709/bali-for-digital-nomads.jpg"
      alt=""
    />

    <img
      class="three"
      src="https://worldestate.homes/wp-content/uploads/2024/05/snimok-ekrana-2024-05-25-203340-min.png.webp"
      alt=""
    />
    <img
      class="four"
      src="http://st.pl/content/images/trip/background/1698754344_bali.jpg"
      alt=""
    />
  </body>
</html>
